# Private DNS for team Epic Router. Runs on Mac 1 (10.7.5.47).
# Start (needs sudo because port 53 is privileged):
#   mac1/start-dnsmasq.sh   (or in a window: sudo dnsmasq -k --log-facility=- -C <repo>/dns/dnsmasq.conf)
# If Mac 1's IP changes, update the 3 places that say 10.7.5.47 (interface=en0 follows the Wi-Fi automatically).

# Serve the Wi-Fi LAN (en0) so Mac 2 can query us, plus loopback for Mac 1 itself.
interface=en0
listen-address=127.0.0.1,10.7.5.47
# Bind exactly those addresses instead of the wildcard 0.0.0.0.
bind-interfaces

# Our records. Both names point to Mac 1 because nginx (the edge) runs there.
address=/app.teamepicrouter.test/10.7.5.47
address=/api.teamepicrouter.test/10.7.5.47

# We are authoritative for teamepicrouter.test: never forward these names upstream.
local=/teamepicrouter.test/
# TTL (seconds) clients may cache our answers.
local-ttl=30

# Ignore /etc/resolv.conf. Everything else (google.com, ...) goes to public resolvers.
no-resolv
server=1.1.1.1
server=8.8.8.8

# Print every query (with the client IP) in the dnsmasq window.
log-queries
