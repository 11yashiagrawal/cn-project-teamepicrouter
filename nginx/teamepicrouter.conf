# Edge for team Epic Router. Runs on Mac 1 (10.7.5.47): reverse proxy + round-robin load balancer + TLS termination.
# Install:  cp nginx/teamepicrouter.conf $(brew --prefix)/etc/nginx/servers/ && nginx -t && (nginx -s reload || nginx)
# Runs as the normal user (no sudo): macOS lets any user listen on ports 80/443 on all interfaces.
# If Mac 2's IP changes, update the 2 "server" lines in the upstream.

upstream teamepicrouter_backends {
    # Shared memory so all nginx workers agree on which backend is down.
    # 128k, not 64k: Apple Silicon uses 16 KB pages and nginx needs >= 8 pages.
    zone teamepicrouter_backends 128k;
    # No algorithm named = round-robin. 1 failure -> skip that backend for 10s.
    server 10.7.2.167:3001 max_fails=1 fail_timeout=10s;   # Backend A (Mac 2)
    server 10.7.2.167:3002 max_fails=1 fail_timeout=10s;   # Backend B (Mac 2)
}

# Port 80: plain HTTP only redirects to HTTPS.
server {
    listen 80;
    server_name app.teamepicrouter.test api.teamepicrouter.test;
    return 301 https://$host$request_uri;
}

# Port 443: TLS ends here; nginx talks plain HTTP to the backends.
server {
    listen 443 ssl;
    http2 on;   # nginx >= 1.25.1 syntax (we have 1.31.6)
    server_name app.teamepicrouter.test api.teamepicrouter.test;

    # Relative to /opt/homebrew/etc/nginx/. The key exists only on Mac 1, never in git.
    ssl_certificate     tls/app.teamepicrouter.test.crt;
    ssl_certificate_key tls/app.teamepicrouter.test.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://teamepicrouter_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
    }
}
